trigger:
  - main

variables:
  acrLoginServer: 'crappprodeastus001.azurecr.io'
  imageName: 'spring-app'
  tag: $(Build.BuildId)
  resourceGroup: 'app'
  containerAppName: 'ca-app-prod-eastus-001'

stages:

  - stage: BuildPush
    displayName: 'Build & Push Image to ACR'
    jobs:
      - job: Build
        pool:
          name: MyLocalAgent        # ← CAMBIO AQUÍ
        steps:
          - checkout: self
          - task: Docker@2
            displayName: 'Build and Push to ACR'
            inputs:
              containerRegistry: 'sc-acr-connection'
              repository: $(imageName)
              command: buildAndPush
              Dockerfile: Dockerfile
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: 'Deploy to Container Apps'
    dependsOn: BuildPush
    jobs:
      - job: Deploy
        pool:
          name: MyLocalAgent        # ← CAMBIO AQUÍ
        steps:
          - task: AzureCLI@2
            displayName: 'Update Container App'
            inputs:
              azureSubscription: 'sc-azure-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(containerAppName) \
                  --resource-group $(resourceGroup) \
                  --image $(acrLoginServer)/$(imageName):$(tag)